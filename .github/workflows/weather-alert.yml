name: 天气预警监测

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: weather-alert-push/state.db
          key: wa-state-${{ github.run_id }}
          restore-keys: |
            wa-state-

      - name: 运行监测并推送到手机
        env:
          WA_BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          cd weather-alert-push
          cp config.example.json config.json
          python main.py

      - name: 心跳保活
        run: |
          if [ ! -f hb.txt ] || [ -n "$(find hb.txt -mtime +6 2>/dev/null)" ]; then
            date -u > hb.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hb.txt
            git commit -m "heartbeat" || true
            git push || true
          fi
